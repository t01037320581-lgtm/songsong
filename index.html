<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사과 팡</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍎</span>
        <div>
          <p class="eyebrow">10이 되면 사라지는 퍼즐</p>
          <h1>사과 팡</h1>
        </div>
      </div>
      <button class="icon-button" id="helpButton" type="button" aria-label="게임 설명">?</button>
    </header>

    <section class="game-panel" aria-label="사과게임">
      <div class="status-bar">
        <div class="stat">
          <span>시간</span>
          <strong id="timer">02:00</strong>
        </div>
        <div class="target">합계 목표 <strong>10</strong></div>
        <div class="stat score-stat">
          <span>점수</span>
          <strong id="score">0</strong>
        </div>
      </div>

      <div class="board-wrap">
        <div class="selection-sum" id="selectionSum" aria-live="polite"></div>
        <div class="game-board" id="gameBoard" role="grid" aria-label="사과 10x10 게임판"></div>
      </div>

      <div class="controls">
        <button class="primary-button" id="newGameButton" type="button">새 게임</button>
      </div>
    </section>
  </main>

  <dialog id="helpDialog">
    <div class="dialog-content">
    <button class="dialog-close" id="closeHelpButton" type="button" aria-label="닫기">×</button>
      <span class="dialog-icon" aria-hidden="true">🍎</span>
      <h2>사과를 모아 합계 10!</h2>
      <p>마우스나 손가락으로 사과를 사각형 모양으로 드래그하세요. 선택한 사과의 합이 10이면 제거되고 점수를 얻습니다.</p>
      <div class="example"><span>3</span><span>2</span><span>5</span><b>→ 10</b></div>
      <button class="primary-button wide" id="startFromHelpButton" type="button">게임 시작</button>
    </div>
  </dialog>

  <dialog id="resultDialog">
    <div class="dialog-content result-content">
      <span class="dialog-icon" aria-hidden="true">🏆</span>
      <p class="eyebrow">게임 종료</p>
      <h2 id="resultTitle">수고했어요!</h2>
      <div class="final-score"><span>최종 점수</span><strong id="finalScore">0</strong></div>
      <button class="primary-button wide" id="playAgainButton" type="button">다시 하기</button>
    </div>
  </dialog>

  <script src="./script.js"></script>
</body>
</html>
